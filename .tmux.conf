# ─────────────────────────────────────────────────────────────
#  tmux config
#  prefix: C-a   ·   reload: <prefix> r
# ─────────────────────────────────────────────────────────────

# ── colours (used by the F12 nested-session toggle below) ────
%hidden color_dark="colour234"
%hidden color_light="colour255"
%hidden color_status_text="colour245"
%hidden color_window_off_indicator="colour088"
%hidden color_window_off_status_bg="colour238"
%hidden color_window_off_status_current_bg="colour254"
%hidden separator_powerline_right=""

# ── general ──────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough
set -sg escape-time 10                      # no <Esc> lag inside vim
set -g focus-events on                      # vim autoread / gitgutter
set -g history-limit 50000
set -g display-time 1500
setw -g mouse on

# 1-indexed windows and panes, renumbered when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── prefix: C-a, on the home row ─────────────────────────────
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

# ── vim-like pane resizing ───────────────────────────────────
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# ── vim-like pane switching ──────────────────────────────────
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ── splits, named the way vim names them (C-w v / C-w s) ─────
# note: tmux's -h/-v are inverted vs vim, so `v` uses -h on purpose
bind v split-window -h -c "#{pane_current_path}"   # vim :vsplit — side by side
bind s split-window -v -c "#{pane_current_path}"   # vim :split  — stacked
bind | split-window -h -c "#{pane_current_path}"   # same, if you prefer the shape
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# `s` was choose-session, moved up a shift
bind S choose-tree -s
unbind %
unbind '"'
# ── vi keys in copy mode; y copies, v selects ────────────────
setw -g mode-keys vi
set -g set-clipboard on                     # OSC52, works over ssh
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── interact with shell ──────────────────────────────────────
# re-run the last command in the other pane
bind -T prefix u send-keys -t ! Up Enter

# ── no arrow keys ────────────────────────────────────────────
unbind Up
unbind Down
unbind Left
unbind Right
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# clear scrollback
bind -n C-k clear-history

# ── nested sessions: F12 turns the outer tmux's keys off ─────
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
  set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
  set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# ── status line ──────────────────────────────────────────────
%hidden wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ \"$(tmux show-option -qv key-table)\" = 'off' ] && echo ' OFF ')#[default]"

set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bold]#S#[default] "
set -g status-right "$wg_is_keys_off #(uptime | sed 's/.*load average[s]*: //') | %H:%M #[bold]#h"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded."
